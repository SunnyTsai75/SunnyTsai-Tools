<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>阿鬆創客週報總覽</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8fafc; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        /* 頂部白底卡片樣式 */
        .header-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        /* 標題與按鈕的排版區塊 */
        .guide-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        /* 標題字體設定 */
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        /* 說明文字樣式 */
        .header-desc {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }
        
        .month-group { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
        }

        /* 按鈕樣式 (已修改為黑底白字) */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: #000000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        
        .back-btn:hover {
            background: #333333;
            transform: translateY(-2px);
        }
        
        summary { 
            color: #ea580c; 
            border-bottom: 2px solid #fdba74; 
            padding-bottom: 10px; 
            margin-top: 0; 
            font-size: 1.3rem; 
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        
        .links-container {
            margin-top: 15px;
        }
        
        .week-link { 
            display: block; 
            padding: 15px 20px; 
            margin: 12px 0; 
            background: #fff7ed; 
            text-decoration: none; 
            color: #9a3412;
            border-radius: 8px; 
            font-weight: bold; 
            transition: all 0.2s ease;
            border: 1px solid #ffedd5; 
        }
        
        .week-link:hover { 
            background: #ea580c; 
            color: white; 
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(234, 88, 12, 0.3); 
        }
    </style>
</head>
<body>
    
    <!-- 頂部標題區塊 -->
    <div class="header-card">
        <div class="guide-title">
            <h1>📰 歷期週報總覽</h1>
            <a href="index.html" class="back-btn">
                ⬅️ 回到主首頁
            </a>
        </div>
        <p class="header-desc">
            歡迎來到阿鬆創客週報總覽！點擊下方的月份即可展開觀看各週的重點特輯與教學內容。
        </p>
    </div>

    <!-- 10月份區塊 -->
    <details class="month-group" open>
        <summary>2026 年 10 月</summary>
        <div class="links-container">
            <a href="./reports/Asong_Weekly_Report_20261024.html" class="week-link" target="_blank">🎃 10月下旬整合特輯 (10/18 - 10/24)</a>
            <a href="./reports/Asong_Weekly_Report_20261017.html" class="week-link" target="_blank">⚡️ 10月中旬重點特輯 (10/11 - 10/17)</a>
            <a href="./reports/Asong_Weekly_Report_20261010.html" class="week-link" target="_blank">🤖 10月上旬重點特輯 (10/04 - 10/10)</a>
        </div>
    </details>

    <!-- 未來你可以直接複製上面的 <details class="month-group"> 區塊，改成 11 月份繼續往下擴充 -->
</body>
</html>

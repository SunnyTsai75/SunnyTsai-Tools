<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>阿鬆創客週報總覽</title>
    <style>
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8fafc; 
            max-width: 800px; margin: 40px auto; padding: 20px; 
        }
        
        .month-group { background: white; 
                      padding: 25px; 
                      border-radius: 12px; 
                      margin-bottom: 25px;
                      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
                      border: 1px solid #e2e8f0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: #4b5563; /* 沉穩的灰色 */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 25px;
            transition: 0.2s;
            align-self: flex-start; /* 靠左對齊 */
        }
        
        .back-btn:hover {
            background: #374151;
            transform: translateY(-2px);
        }
        
        h3 { 
            color: #ea580c; 
            border-bottom: 2px solid #fdba74; 
            padding-bottom: 10px; 
            margin-top: 0; 
            font-size: 1.3rem; 
        }
        
        .week-link { display: block; padding: 15px 20px; 
                    margin: 12px 0; background: #fff7ed; 
                    text-decoration: none; color: #9a3412;
                    border-radius: 8px; font-weight: bold; 
                    transition: all 0.2s ease;
                    border: 1px solid #ffedd5; 
        }
        
        .week-link:hover { 
            background: #ea580c; 
            color: white; 
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(234, 88, 12, 0.3); 
        }
        
        .back-btn { 
            color: #2563eb; text-decoration: none; 
            font-weight: bold; display: inline-block; 
            margin-bottom: 20px;
        }
        
        .back-btn:hover { text-decoration: underline; }
        
        .guide-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .guide-title .back-btn {
            flex-shrink: 0;
            margin: 0;
            align-self: auto;
        }
    </style>
</head>
<body>
    <h1 class="guide-title">
        <span>📰 歷期週報總覽</span>
        <a href="index.html" class="back-btn">
            ⬅️ 回到主首頁
        </a>
    </h1>


    <!-- 10月份區塊 -->
    <div class="month-group">
        <h3>2026 年 10 月</h3>
        <a href="./reports/Asong_Weekly_Report_20261024.html" class="week-link" target="_blank">🎃 10月下旬整合特輯 (10/18 - 10/24)</a>
        <a href="./reports/Asong_Weekly_Report_20261017.html" class="week-link" target="_blank">⚡️ 10月中旬重點特輯 (10/11 - 10/17)</a>
        <a href="./reports/Asong_Weekly_Report_20261010.html" class="week-link" target="_blank">🤖 10月上旬重點特輯 (10/04 - 10/10)</a>
    </div>

</html>
